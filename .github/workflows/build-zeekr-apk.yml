name: Build Zeekr APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-zeekr-apk.yml'
      - 'settings.gradle'
      - 'zeekr/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build standalone Zeekr APK and run tests
        run: |
          chmod +x gradlew
          ./gradlew :zeekr:assembleDebug :zeekr:testDebugUnitTest :zeekr:lintDebug --no-daemon --console=plain
      - name: Audit permissions and components of the final APK
        run: |
          mkdir -p dist
          python3 zeekr/verify-apk.py "$ANDROID_HOME/build-tools/34.0.0/aapt" zeekr/build/outputs/apk/debug/zeekr-debug.apk > dist/permissions.txt
          cat dist/permissions.txt
          cp zeekr/build/outputs/apk/debug/zeekr-debug.apk dist/
      - name: Upload APK and permission audit
        uses: actions/upload-artifact@v4
        with:
          name: zeekr-ble-minimal-apk
          path: dist/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeekr-scan-test-reports
          path: zeekr/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
